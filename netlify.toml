[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/capture"
  to = "/.netlify/functions/capture"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/editorial-sync"
  to = "/.netlify/functions/editorial-sync"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
