[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."import-legacy"]
  included_files = [
    "supabase/seed-legacy-news.json",
    "supabase/seed-legacy-topics.json",
  ]

[[redirects]]
  from = "/api/capture"
  to = "/.netlify/functions/capture"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/editorial-sync"
  to = "/.netlify/functions/editorial-sync"
  status = 200

[[redirects]]
  from = "/api/import-legacy"
  to = "/.netlify/functions/import-legacy"
  status = 200

[[redirects]]
  from = "/api/extension-auth"
  to = "/.netlify/functions/extension-auth"
  status = 200

[[redirects]]
  from = "/api/extension-session"
  to = "/.netlify/functions/extension-session"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
