<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Signals Settings</title>
  <style>
    body { margin: 0; padding: 24px; font-family: Inter, Segoe UI, Arial, sans-serif; color: #20243d; background: linear-gradient(135deg, #eef7ff, #f3edff); }
    main { max-width: 520px; background: rgba(255,255,255,.86); border: 1px solid rgba(151, 164, 255, .34); border-radius: 22px; padding: 22px; box-shadow: 0 24px 60px rgba(92, 83, 194, .18); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    h2 { margin: 22px 0 10px; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: #6269df; }
    p, .status { color: #6269df; font-size: 13px; line-height: 1.5; }
    label { display: grid; gap: 6px; margin-bottom: 14px; font-size: 13px; color: #555b80; }
    input, select { height: 40px; border: 1px solid rgba(151, 164, 255, .42); border-radius: 14px; padding: 0 12px; font: 14px Inter, Segoe UI, Arial, sans-serif; color: #20243d; }
    button { height: 40px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #7179ff, #9a72ff); color: #fff; font-weight: 700; padding: 0 16px; cursor: pointer; }
    button.secondary { background: #fff; color: #4a4f7a; border: 1px solid rgba(151, 164, 255, .42); }
    .row { display: flex; gap: 8px; align-items: center; }
    .account dt { color: #8a90ad; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .account dd { margin: 0 0 10px; font-weight: 700; color: #20243d; }
    .check { display: flex; align-items: center; gap: 8px; color: #41486f; font-size: 13px; }
    .check input { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>AI Signals</h1>
    <p>Sign in with the same work email used for the team dashboard. Capture is allowed only for accounts in team_members.</p>
    <section id="signedOut">
      <label id="workspaceField">
        Workspace URL
        <input id="apiBase" placeholder="https://aiinsightpipeline.netlify.app">
      </label>
      <div class="row">
        <button id="signIn" type="button">Sign in with work email</button>
        <span class="status" id="status"></span>
      </div>
    </section>
    <section id="account" hidden>
      <h2>Account</h2>
      <dl class="account">
        <dt>Name</dt>
        <dd id="displayName"></dd>
        <dt>Email</dt>
        <dd id="email"></dd>
        <dt>Authorized</dt>
        <dd id="authorized"></dd>
      </dl>
      <button class="secondary" id="signOut" type="button">Sign out</button>
    </section>
    <section>
      <h2>Display</h2>
      <label class="check">
        <input id="startCollapsed" type="checkbox">
        Start collapsed
      </label>
    </section>
    <section>
      <h2>Capture</h2>
      <label>
        Default category
        <select id="defaultCategory"></select>
      </label>
    </section>
  </main>
  <script src="options.js" type="module"></script>
</body>
</html>
